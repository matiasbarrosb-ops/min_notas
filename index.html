<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Notas">
<meta name="description" content="Tus ramos, tus notas y cuánto necesitas en el examen.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<title>Mis Notas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;
  --bg:#f4f3ef;--surface:#fcfcfb;--surface-2:#f0efea;--line:#e2e0d8;--text:#0b0b0b;--text-2:#52514e;--muted:#8a8984;
  --accent:#2a78d6;--accent-soft:#e3eefb;--good:#1a7f37;--good-bg:#e5f4e9;--warn:#a86400;--warn-bg:#fdf1dc;--bad:#c62828;--bad-bg:#fbe6e6;
  --series:#2a78d6;--ref:#52514e;--radius:14px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--surface-2:#232321;--line:#2f2f2c;--text:#f0efec;--text-2:#c3c2b7;--muted:#8d8c86;
  --accent:#3987e5;--accent-soft:#1d2b3d;--good:#4cc26b;--good-bg:#16291b;--warn:#e2a03a;--warn-bg:#2d2414;--bad:#ef6b6b;--bad-bg:#311a1a;--series:#3987e5;--ref:#c3c2b7;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--surface-2:#232321;--line:#2f2f2c;--text:#f0efec;--text-2:#c3c2b7;--muted:#8d8c86;
  --accent:#3987e5;--accent-soft:#1d2b3d;--good:#4cc26b;--good-bg:#16291b;--warn:#e2a03a;--warn-bg:#2d2414;--bad:#ef6b6b;--bad-bg:#311a1a;--series:#3987e5;--ref:#c3c2b7;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.logo{width:34px;height:34px;border-radius:10px;display:block}
.brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.course-card{cursor:pointer;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:12px}
.course-card:hover{border-color:var(--accent);transform:translateY(-1px)}
.sigla{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.04em}
.cname{font-size:17px;font-weight:600;margin:2px 0 0;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:500}
.stat .val{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .val.sm{font-size:15px;font-weight:600;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.neutral{background:var(--surface-2);color:var(--text-2)}.pill.info{background:var(--accent-soft);color:var(--accent)}
.next{font-size:13px;color:var(--text-2);border-top:1px solid var(--line);padding-top:10px}
.tag-conf{font-size:11.5px;color:var(--warn);font-weight:600}
h2.section{font-size:15px;font-weight:600;margin:26px 0 10px;color:var(--text-2)}
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:6px}
@media (max-width:760px){.overview{grid-template-columns:repeat(2,1fr)}}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.detail-head h2{font-size:24px;margin:2px 0 4px;letter-spacing:-.02em}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
.two>*{min-width:0}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.parte{margin-bottom:16px}
.parte-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.parte-h b{font-size:14px}.parte-h span{font-size:12.5px;color:var(--muted)}
table.ev{width:100%;border-collapse:collapse}
table.ev th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
table.ev td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
table.ev tr.sub td:first-child{padding-left:22px;color:var(--text-2)}
table.ev td.w{color:var(--text-2);font-variant-numeric:tabular-nums;width:62px}
table.ev td.f{color:var(--muted);font-size:12.5px;width:70px}
input.g{width:66px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
input.g:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
input.g.bad{border-color:var(--bad)}
input.wt{width:54px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);text-align:center}
.calc{display:flex;align-items:center;justify-content:center;width:66px;height:32px;border-radius:8px;background:var(--surface-2);font-weight:600;color:var(--text-2);font-variant-numeric:tabular-nums}
label.chk{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;color:var(--text-2);cursor:pointer}
.result-big{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;background:var(--surface-2)}
.result-big .num{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.result-big .msg{font-size:14px;color:var(--text-2)}
.ctrl{display:flex;flex-direction:column;gap:4px;margin-top:12px}
.ctrl label{font-size:12.5px;color:var(--text-2);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:500}
.seg button.on{background:var(--accent);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.infobox{background:var(--accent-soft);color:var(--text);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.errbox{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:9px 12px;font-size:13px;margin:8px 0}
.rules{font-size:13px;color:var(--text-2);padding-left:18px}.rules li{margin:3px 0}
.chart-card h3{font-size:14px;margin:0 0 2px;font-weight:600}
.chart-card .sub{font-size:12.5px;color:var(--muted);margin-bottom:8px}
svg text{font-family:inherit}svg{max-width:100%;display:block}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--surface);font-size:12.5px;padding:6px 9px;border-radius:7px;z-index:80;opacity:0;transition:opacity .08s;white-space:nowrap;font-weight:500}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:24px 14px;overflow:auto}
.modal{background:var(--surface);border-radius:16px;max-width:720px;width:100%;padding:20px;position:relative}
.modal h3{margin:0 0 12px;font-size:18px}
.x{position:absolute;top:12px;right:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;flex:1}
.field label{font-size:12.5px;color:var(--text-2);font-weight:500}
.inp,.field input,.field textarea,.field select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);width:100%}
.field textarea{min-height:110px;resize:vertical}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);margin-bottom:10px}
.cat-list{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
.cat-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.cat-item .meta{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.dropzone{border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--text-2);cursor:pointer}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:28px;cursor:pointer;display:grid;place-items:center;margin:6px auto}
.mic.rec{background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(198,40,40,.15)}}
.prev-parte{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.prev-row{display:grid;grid-template-columns:1fr 64px 112px 74px 28px;gap:6px;align-items:center;margin-bottom:6px}
.prev-row input[type=text],.prev-row input[type=date],.prev-row input.num{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);width:100%;font-size:13.5px}
.prev-row.subr{padding-left:18px;grid-template-columns:1fr 112px 28px}
@media (max-width:560px){.prev-row{grid-template-columns:1fr 56px 28px}.prev-row .hide-sm{display:none}}
.sum-ok{color:var(--good);font-size:12.5px;font-weight:600}.sum-bad{color:var(--bad);font-size:12.5px;font-weight:600}
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.login{max-width:420px;margin:60px auto}
.banner{font-size:12.5px;color:var(--text-2);background:var(--surface-2);border-radius:10px;padding:8px 12px;margin-bottom:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}


/* ===== Tabla de notas con grupos ===== */
table.ev tr.grp td{background:var(--surface-2)}
table.ev tr.grp.d1 td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
table.ev tr.grp.d2 td,table.ev tr.grp.d3 td{background:transparent}
/* ===== Editor Lego ===== */
.modal.full{max-width:860px;padding:0;display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
.ed{display:flex;flex-direction:column;min-height:0;flex:1}
.ed-top{padding:18px 20px 10px;border-bottom:1px solid var(--line)}
.ed-body{padding:14px 20px;overflow:auto;flex:1;min-height:0}
.ed-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.piezas{position:sticky;top:-14px;z-index:5;background:var(--surface);padding:10px 0 10px;margin-bottom:6px;border-bottom:1px dashed var(--line)}
.pieza{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.pieza:hover{border-color:var(--accent);color:var(--accent)}
.varias{margin-top:8px;font-size:13px;background:var(--accent-soft);border-radius:10px;padding:8px}
.arbol{display:flex;flex-direction:column;gap:6px}
.blk{border:1px solid var(--line);border-radius:12px;background:var(--surface);--c:#2a78d6}
.blk[data-d="1"]{--c:#2a78d6}.blk[data-d="2"]{--c:#8a5cd1}.blk[data-d="3"]{--c:#1a9e8f}.blk[data-d="4"]{--c:#c77b12}
.blk.g{border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 5%,var(--surface))}
.blk.raiz{border-left:4px solid var(--text);background:var(--surface)}
.blk.sel{box-shadow:0 0 0 2px var(--accent)}
.blk-row{display:flex;align-items:center;gap:6px;padding:7px 8px;flex-wrap:wrap;border-radius:10px}
.blk.g>.blk-row{cursor:pointer}
.blk-row.over{background:var(--accent-soft);box-shadow:inset 0 3px 0 var(--accent)}
.handle{cursor:grab;color:var(--muted);font-size:16px;padding:0 2px;user-select:none;touch-action:none}
.tog{border:0;background:none;cursor:pointer;font-size:13px;color:var(--text-2);width:20px;padding:0}
.ico{font-size:15px}
.nom{flex:1;min-width:120px;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 7px;font-weight:600}
.nom:hover,.nom:focus{border-color:var(--line);background:var(--surface-2);outline:none}
.pct-w{display:inline-flex;align-items:center;gap:2px;font-size:13px;color:var(--text-2)}
.pct{width:58px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);text-align:center;font-weight:600}
.pct-s{font-size:12.5px;color:var(--muted)}
.eff{font-size:11.5px;color:var(--muted);min-width:46px;text-align:right}
.bds{display:inline-flex;gap:4px;flex-wrap:wrap}.bd{padding:1px 7px!important;font-size:11px!important}
.ib{border:0;background:none;cursor:pointer;color:var(--text-2);font-size:15px;width:28px;height:28px;border-radius:7px}
.ib:hover{background:var(--surface-2)}.ib.del:hover{color:var(--bad)}
.hijos{padding:2px 8px 8px 18px;display:flex;flex-direction:column;gap:6px}
.blk.raiz>.hijos{padding-left:8px}
.g-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border:1.5px dashed transparent;border-radius:9px;padding:2px 4px}
.g-foot .drop-hint{display:none;font-size:12px;color:var(--accent)}
.g-foot.over{border-color:var(--accent);background:var(--accent-soft)}.g-foot.over .drop-hint{display:inline}
.mas{margin:0 8px 8px;padding:10px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px;font-size:13px}
@media (max-width:760px){
  .modal.full{max-height:96vh;height:96vh;border-radius:18px 18px 0 0}
  .ed-top{padding:16px 14px 8px}.ed-body{padding:10px 12px}.ed-foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .ed-foot .btn{flex:1}
  .hijos{padding-left:10px}
  .blk-row{row-gap:4px}
  .nom{min-width:0;flex:1 1 calc(100% - 90px);font-size:16px!important}
  .blk-row .pct-w,.blk-row .pct-s{margin-left:30px}
  .blk-row .ib:first-of-type{margin-left:auto}
  .pct{font-size:16px!important}
  .eff{display:none}
  .pieza{padding:7px 10px;white-space:nowrap}
  .piezas>.row{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
}
/* ===== App instalada / celular ===== */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.wrap{padding-top:calc(20px + env(safe-area-inset-top))}
button,.btn,.seg button,.tabs button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tabbar{display:none}
.det{display:grid;grid-template-columns:1.25fr 1fr;grid-template-areas:"tabla res" "tabla extra";gap:14px;align-items:start}
.det>*{min-width:0}.det .a-res{grid-area:res}.det .a-tabla{grid-area:tabla}.det .a-extra{grid-area:extra;display:flex;flex-direction:column;gap:14px}
.install{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13.5px}
.offline{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
@media (max-width:760px){
  .wrap{padding:calc(12px + env(safe-area-inset-top)) 12px calc(96px + env(safe-area-inset-bottom))}
  header.top{margin-bottom:12px}
  #hdr .hide-m{display:none}
  .det{grid-template-columns:1fr;grid-template-areas:"res" "tabla" "extra"}
  input,select,textarea,.inp,.field input,.field textarea{font-size:16px!important}
  input.g{width:74px;height:42px;font-size:17px!important}
  input.wt{font-size:16px!important;width:60px}
  .btn{min-height:40px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;align-items:center}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer}
  .tabbar button .ic{font-size:21px;line-height:1}
  .tabbar button.on{color:var(--accent)}
  .tabbar button.add .ic{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:24px;margin-top:-18px;box-shadow:0 4px 14px rgba(42,120,214,.35)}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:sube .22s ease-out}
  .cat-list{max-height:none}
  .overview{gap:8px}.overview .card{padding:11px 12px}.overview .val{font-size:22px}
  .result-big .num{font-size:52px}
  .detail-head{margin-bottom:10px}.detail-head h2{font-size:22px}
  .detail-head .row{gap:4px}.detail-head .row .btn{min-height:34px;padding:5px 10px;font-size:13px}
  .back-btn{display:none}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
@keyframes sube{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (display-mode: standalone){body{overscroll-behavior-y:none}}
@media (max-width:520px){table.ev td.f,table.ev th:nth-child(3){display:none}.wrap{padding:14px 12px 50px}.card{padding:13px}.brand small{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" onclick="go('')"><img class="logo" src="/icons/icon-192.png" alt="" width="34" height="34"><div><h1>Mis Notas</h1><small id="subt">Tus ramos, tus notas</small></div></div>
    <div class="row" id="hdr"></div>
  </header>
  <div id="banner"></div>
  <main id="app"><div class="card" style="text-align:center"><span class="spinner"></span></div></main>
</div>
<div class="tip" id="tip"></div>
